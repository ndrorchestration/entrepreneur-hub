# Entrepreneur Hub maintenance checkpoint
# Manual-only: the former weekly schedule produced stale governance issues and
# outdated authority/status language. Use this workflow only when a human wants
# a fresh repository-maintenance checklist.

name: Entrepreneur Hub Maintenance Check

on:
  workflow_dispatch:
    inputs:
      checkpoint_id:
        description: 'Optional checkpoint identifier'
        required: false
        default: 'EH-MAINTENANCE-MANUAL'

permissions:
  issues: write

jobs:
  create-maintenance-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository maintenance issue
        uses: actions/github-script@v7
        with:
          script: |
            const checkpoint = '${{ inputs.checkpoint_id }}' || 'EH-MAINTENANCE-MANUAL';
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              `## ${checkpoint} — Repository Maintenance Check`,
              `**Date:** ${date}`,
              '',
              'This issue is a manual maintenance checklist. It does not confer governance authority, certification, readiness, or evidence status.',
              '',
              '### Distribution',
              '- [ ] Current public links resolve without 404s.',
              '- [ ] Calls-to-action still point to intended destinations.',
              '- [ ] Template/index references match current published material.',
              '',
              '### Repository health',
              '- [ ] Open issues and pull requests are triaged.',
              '- [ ] README/status language matches current implementation evidence.',
              '- [ ] CI/dependency/security findings are reviewed.',
              '- [ ] Historical checkpoints are not presented as current authority.',
              '',
              '### Commercial / portfolio boundary',
              '- [ ] Revenue or distribution claims are supported by current evidence.',
              '- [ ] Experimental templates are not described as certified or enterprise-ready without evidence.',
              '',
              '*Created manually by `.github/workflows/sweep-reminder.yml`.*',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${checkpoint} — Repository Maintenance Check — ${date}`,
              body,
              labels: ['maintenance'],
            });
